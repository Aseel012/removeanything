# /etc/nginx/sites-available/removeanything.in
# Replace YOUR_SSL_CERT_PATH with actual cert paths from Certbot

server {
    listen 80;
    server_name removeanything.in www.removeanything.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name removeanything.in www.removeanything.in;

    # SSL — generate with: certbot --nginx -d removeanything.in -d www.removeanything.in
    ssl_certificate     /etc/letsencrypt/live/removeanything.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/removeanything.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (Flask also sets these, nginx doubles up)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY always;
    add_header X-Content-Type-Options     nosniff always;
    add_header Referrer-Policy            strict-origin-when-cross-origin always;

    # Hide server info
    server_tokens off;

    # Upload limits
    client_max_body_size 55m;

    # Static files served directly by nginx (fast)
    location /static/ {
        alias /var/www/removeanything/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location /static/img/favicon.svg {
        alias /var/www/removeanything/static/img/favicon.svg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Block common attack paths
    location ~ /\.(env|git|htaccess|DS_Store) { deny all; return 404; }
    location ~ /(wp-admin|wp-login|phpMyAdmin|phpmyadmin|.php) { return 404; }

    # Proxy everything else to Flask/Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_buffering    off;
    }
}
